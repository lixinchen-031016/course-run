# =============================================================================
# CourseRun - CI/CD
# -----------------------------------------------------------------------------
# 类型    : Python + Tkinter 跨平台桌面 GUI
# 测试    : Python unittest（无显示器依赖）
# 构建    : Windows x86_64 -> 单文件 exe
#           macOS ARM64    -> .app + .dmg
# 发布    : main 推送生成滚动 nightly；v* 标签生成正式 Release
# =============================================================================

name: CI/CD - CourseRun

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: "CourseRun"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: 运行单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 安装项目
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 校验打包入口
        run: python -m py_compile build.py src/course_run/gui_main.py

  build-windows:
    name: 构建 Windows x86_64
    needs: test
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python x64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-build.txt

      - name: 校验 x86_64 架构
        run: |
          python -c "import platform, struct; print(platform.machine(), struct.calcsize('P') * 8); assert platform.machine().lower() in ('amd64', 'x86_64'); assert struct.calcsize('P') * 8 == 64"

      - name: 构建 GUI
        run: python build.py

      - name: 校验与冒烟测试
        shell: pwsh
        run: |
          $exe = "dist\${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不存在: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "冒烟测试失败，退出码: $($process.ExitCode)" }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: 构建 macOS ARM64
    needs: test
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ARM64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-build.txt

      - name: 校验 arm64 架构
        run: |
          python -c "import platform; print(platform.machine()); assert platform.machine() == 'arm64'"

      - name: 构建 GUI
        run: python build.py

      - name: 冒烟测试
        run: |
          APP="dist/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          test -x "$APP"
          "$APP" --self-test

      - name: 制作 DMG
        run: |
          rm -rf dmg
          mkdir dmg
          cp -R "dist/${{ env.APP_NAME }}.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create \
            -volname "${{ env.APP_NAME }}" \
            -srcfolder dmg \
            -ov -format UDZO \
            "${{ env.APP_NAME }}-macOS-arm64.dmg"

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.APP_NAME }}-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: 发布到 GitHub Releases
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos

      - name: 计算发布信息
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=CourseRun ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=CourseRun nightly (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            gh release delete nightly --yes || true
            git push --delete origin nightly 2>/dev/null || true
          fi

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --generate-notes \
            $([ "${{ steps.meta.outputs.prerelease }}" = "true" ] && echo "--prerelease") \
            "artifacts/windows/${APP_NAME}.exe" \
            "artifacts/macos/${APP_NAME}-macOS-arm64.dmg"
